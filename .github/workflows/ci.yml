name: Linux CI

on:
  push:
  pull_request:

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev
      - name: Configurer
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
      - name: Compiler
        run: cmake --build build --parallel 2
      - name: Tester
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Construire le paquet Debian
        run: cpack --config build/CPackConfig.cmake -G DEB
